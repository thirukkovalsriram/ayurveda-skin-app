<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ayurvedic Skin Disease Image Analysis System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-teal-50 min-h-screen font-sans text-gray-800">
  <div class="max-w-3xl mx-auto py-10 px-4">
    <header class="text-center mb-8">
      <h1 class="text-3xl font-bold text-teal-900">Ayurvedic Skin Disease Analysis &amp; Remedy System</h1>
      <p class="text-teal-700 mt-1">Upload a Photo of the Affected Skin Area for Visual Diagnosis &amp; Herbal Prescription</p>
    </header>

    <div class="bg-white p-6 rounded-xl shadow-md border border-teal-100">
      <div class="mb-4">
        <label class="block text-sm font-semibold mb-2">Upload Skin Condition Photo (JPG / PNG)</label>
        <input id="skinImage" type="file" accept="image/*" onchange="previewPhoto(event)"
          class="w-full p-2 border rounded-lg bg-gray-50 text-sm" />
        <div id="previewBox" class="hidden mt-3 flex justify-center">
          <img id="previewImg" class="max-h-56 rounded-lg border shadow-sm object-cover" alt="Skin preview" />
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-sm font-semibold mb-1">Your Skin Type</label>
          <select id="skinType" class="w-full p-2.5 border rounded-lg bg-gray-50">
            <option value="Oily">Oily</option>
            <option value="Dry">Dry</option>
            <option value="Sensitive">Sensitive</option>
            <option value="Combination">Combination</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1">Additional Symptoms (Optional)</label>
          <input id="notes" type="text" placeholder="e.g., itching, burning, scaling..."
            class="w-full p-2.5 border rounded-lg bg-gray-50" />
        </div>
      </div>

      <button onclick="analyzeImage()"
        class="w-full bg-teal-700 hover:bg-teal-800 text-white font-semibold py-2.5 rounded-lg transition">
        Analyze Skin Photo &amp; Get Ayurvedic Solution
      </button>
    </div>

    <div id="metricsBox" class="hidden mt-4 bg-white p-4 rounded-xl shadow-sm border border-teal-100 text-xs text-gray-600 flex justify-around"></div>
    <div id="results" class="mt-4 space-y-4"></div>

    <footer class="text-center text-xs text-gray-500 mt-10">
      B.Tech CSE Project | Developed by Thirukkovalluru Sriram
    </footer>
  </div>

  <script>
    function previewPhoto(event) {
      const file = event.target.files[0];
      if (!file) return;
      const previewImg = document.getElementById("previewImg");
      previewImg.src = URL.createObjectURL(file);
      document.getElementById("previewBox").classList.remove("hidden");
    }

    async function analyzeImage() {
      const fileInput = document.getElementById("skinImage");
      const skinType = document.getElementById("skinType").value;
      const notes = document.getElementById("notes").value;
      const resultsDiv = document.getElementById("results");
      const metricsBox = document.getElementById("metricsBox");

      if (!fileInput.files || fileInput.files.length === 0) {
        alert("Please upload a photo of the skin area first.");
        return;
      }

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);
      formData.append("skin_type", skinType);
      formData.append("notes", notes);

      resultsDiv.innerHTML = `<p class="text-center text-teal-700">Analyzing skin lesion color and texture features...</p>`;
      metricsBox.classList.add("hidden");

      try {
        const res = await fetch("http://127.0.0.1:8000/analyze-image", {
          method: "POST",
          body: formData
        });
        const data = await res.json();

        metricsBox.innerHTML = `
          <span><strong>Erythema (Redness) Index:</strong> ${data.image_metrics.redness_index}%</span>
          <span><strong>Surface Brightness:</strong> ${data.image_metrics.brightness}</span>
          <span><strong>Texture Variance:</strong> ${data.image_metrics.texture_variance}</span>
        `;
        metricsBox.classList.remove("hidden");

        resultsDiv.innerHTML = data.recommendations.map(item => `
          <div class="bg-white p-6 rounded-xl shadow border-l-4 border-teal-600">
            <div class="flex justify-between items-center mb-2">
              <h2 class="text-xl font-bold text-teal-900">${item.condition} <span class="text-sm font-normal text-gray-500">(${item.ayurvedic_name})</span></h2>
              <span class="bg-teal-100 text-teal-800 text-xs font-bold px-2.5 py-1 rounded">Visual Match: ${item.confidence}%</span>
            </div>
            <p class="text-sm text-gray-600 mb-3"><strong>Imbalanced Dosha:</strong> ${item.dosha}</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm">
              <div class="bg-teal-50 p-3 rounded"><strong>Key Herbs:</strong> ${item.herbs}</div>
              <div class="bg-teal-50 p-3 rounded"><strong>Classical Formulation:</strong> ${item.formulation}</div>
            </div>
            <p class="text-sm mt-3"><strong>Usage &amp; Application:</strong> ${item.usage}</p>
            <p class="text-sm mt-1"><strong>Diet &amp; Lifestyle (Ahara-Vihara):</strong> ${item.diet_advice}</p>
            <p class="text-xs text-amber-700 mt-3 bg-amber-50 p-2 rounded"><strong>Precaution:</strong> ${item.precaution}</p>
          </div>
        `).join("");
      } catch (err) {
        resultsDiv.innerHTML = `<p class="text-center text-red-600">Unable to reach backend server. Ensure FastAPI is running on port 8000.</p>`;
      }
    }
  </script>
</body>
</html>
